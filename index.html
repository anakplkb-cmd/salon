function mock(a,p){
 const D=DB,ok=(o={})=>({ok:true,...o}),me=S.user;
 if(a=='login'){const u=D.Users.find(x=>x.Username==p.username.toLowerCase()&&x.Password==p.password&&x.Status=='Aktif');if(!u)throw Error('Username atau password salah');return ok({token:'prev',user:{ID:u.ID,Nama:u.Nama,Username:u.Username,Role:u.Role}})}
 if(a=='publicData')return ok({layanan:D.Layanan.filter(x=>x.Status=='Aktif'),pegawai:D.Users.filter(x=>x.Role=='Pegawai'&&x.Status=='Aktif').map(({ID,Nama})=>({ID,Nama})),setting:{...D.Set}});
 if(a=='createBooking'){const b=bk(p);D.Booking.push(b);return ok({kode:b.Kode})}
 if(a=='checkBooking'){const b=D.Booking.find(x=>x.Kode==String(p.kode).trim().toUpperCase());if(!b)throw Error('Kode booking tidak ditemukan');return ok({booking:b})}
 if(a=='list'){let r=D[p.sheet];if(me.Role=='Pegawai'&&['Booking','DetailTransaksi','Gaji'].includes(p.sheet))r=r.filter(x=>x.PegawaiID==me.ID&&(p.sheet!='Gaji'||x.Status=='Dibayar'));return ok({rows:r.map(x=>({...x,Password:undefined}))})}
 if(a=='save'){const t=D[p.sheet],r=p.row;if(r.ID){const o=t.find(x=>x.ID==r.ID);if(!r.Password)delete r.Password;Object.assign(o,r)}else{r.ID=p.sheet[0]+Date.now();t.push(r)}return ok()}
 if(a=='remove'){D[p.sheet]=D[p.sheet].filter(x=>x.ID!=p.id);return ok()}
 if(a=='setStatus'){D.Booking.find(x=>x.ID==p.id).Status=p.status;return ok()}
 if(a=='checkout'){const id='T'+Date.now(),tgl=today(),its=p.items.map(i=>{const l=D.Layanan.find(x=>x.ID==i.LayananID),u=D.Users.find(x=>x.ID==i.PegawaiID);return{ID:'D'+Math.random(),TransaksiID:id,Nama:l.Nama,Harga:l.Harga,PegawaiID:i.PegawaiID,Komisi:l.Harga*(u?.Komisi||0)/100,Tanggal:tgl}}),sub=its.reduce((s,i)=>s+i.Harga,0),tot=Math.max(0,sub-p.diskon);
  if(p.dibayar<tot)throw Error('Uang dibayar kurang dari total');
  const t={ID:id,NoStruk:'INV-'+Date.now().toString().slice(-8),BookingID:p.bookingId,Nama:p.nama||'Umum',Kasir:me.Nama,Subtotal:sub,Diskon:p.diskon,Total:tot,Metode:p.metode,Dibayar:p.dibayar,Kembalian:p.dibayar-tot,Tanggal:tgl};
  D.Transaksi.push(t);D.DetailTransaksi.push(...its);const b=D.Booking.find(x=>x.ID==p.bookingId);if(b)b.Status='Lunas';return ok({trx:t,items:its})}
 if(a=='resetPassword'){if(me.Role!='Admin')throw Error('Akses ditolak');if(String(p.password).length<6)throw Error('Password minimal 6 karakter');D.Users.find(x=>x.ID==p.id).Password=p.password;return ok()}
 if(a=='changePassword'){const u=D.Users.find(x=>x.ID==me.ID);if(u.Password!=p.oldPassword)throw Error('Password lama salah');if(String(p.newPassword).length<6)throw Error('Password baru minimal 6 karakter');u.Password=p.newPassword;return ok()}
 if(a=='gajiGenerate'){if(me.Role!='Admin')throw Error('Akses ditolak');if(!/^\d{4}-\d{2}$/.test(p.periode))throw Error('Periode tidak valid');let n=0;
  D.Users.filter(u=>u.Role=='Pegawai'&&u.Status=='Aktif').forEach(u=>{const kom=D.DetailTransaksi.filter(d=>d.PegawaiID==u.ID&&D10(d.Tanggal).startsWith(p.periode)).reduce((s,d)=>s+Number(d.Komisi),0);
   let g=D.Gaji.find(x=>x.Periode==p.periode&&x.PegawaiID==u.ID);if(g&&g.Status=='Dibayar')return;
   if(!g){g={ID:'G'+Date.now()+n,Periode:p.periode,PegawaiID:u.ID,PegawaiNama:u.Nama,Bonus:0,Potongan:0,Status:'Draft',TanggalBayar:'',Catatan:''};D.Gaji.push(g)}
   g.GajiPokok=Number(u.GajiPokok||0);g.Komisi=kom;g.Total=Math.max(0,g.GajiPokok+kom+Number(g.Bonus)-Number(g.Potongan));n++});return ok({jumlah:n})}
 if(a=='gajiSave'){if(me.Role!='Admin')throw Error('Akses ditolak');const g=D.Gaji.find(x=>x.ID==p.id);if(g.Status=='Dibayar')throw Error('Slip sudah dibayar, tidak bisa diubah');g.Bonus=Math.max(0,+p.bonus||0);g.Potongan=Math.max(0,+p.potongan||0);g.Catatan=p.catatan||'';g.Total=Math.max(0,g.GajiPokok+g.Komisi+g.Bonus-g.Potongan);return ok()}
 if(a=='gajiBayar'){if(me.Role!='Admin')throw Error('Akses ditolak');const g=D.Gaji.find(x=>x.ID==p.id);g.Status='Dibayar';g.TanggalBayar=today();return ok()}
 if(a=='saveSettings'){if(me.Role!='Admin')throw Error('Akses ditolak');if(!String(p.settings.NamaSalon||'').trim())throw Error('Nama usaha wajib diisi');Object.assign(D.Set,p.settings);return ok({setting:{...D.Set}})}
 if(a=='reschedule'){const b=D.Booking.find(x=>x.ID==p.id);if(!b)throw Error('Booking tidak ditemukan');if(['Lunas','Batal'].includes(b.Status))throw Error('Booking '+b.Status+' tidak bisa diubah jadwalnya');if(me.Role=='Pegawai'&&b.PegawaiID!=me.ID)throw Error('Booking ini bukan tugas Anda');
  if(!p.tanggal||p.tanggal<today())throw Error('Tanggal tidak valid');if(!p.jam)throw Error('Jam tidak valid');let pid=b.PegawaiID;if(me.Role!='Pegawai'&&p.pegawaiId)pid=p.pegawaiId;
  if(D.Booking.some(x=>x.ID!=b.ID&&x.PegawaiID==pid&&x.Tanggal==p.tanggal&&x.Jam==p.jam&&!['Batal','Lunas'].includes(x.Status)))throw Error('Jam tersebut sudah terisi untuk stylist ini');
  if(b.Tanggal==p.tanggal&&b.Jam==p.jam&&pid==b.PegawaiID)throw Error('Jadwal belum berubah');
  b.JadwalLama=b.Tanggal+' '+b.Jam;b.Tanggal=p.tanggal;b.Jam=p.jam;if(pid!=b.PegawaiID){b.PegawaiID=pid;b.PegawaiNama=(D.Users.find(x=>x.ID==pid)||{}).Nama}return ok({booking:{...b}})}
 throw Error('Aksi tidak dikenal');
}
async function call(a,p={}){
 if(IS_PREVIEW){await sleep(450);return mock(a,JSON.parse(JSON.stringify(p)))}
 const r=await fetch(GAS_URL,{method:'POST',body:JSON.stringify({action:a,token:S.token,...p})});
 const j=await r.json();if(!j.ok){if(String(j.msg).startsWith('Aksi tidak dikenal'))throw Error('Backend belum diperbarui. Tempel ulang Code.gs terbaru, jalankan setupDatabase, lalu Deploy > Kelola deployment > Versi baru.');throw Error(j.msg||'Terjadi kesalahan')}return j;
}

<label>No. HP / WhatsApp<input id="bh" type="tel" placeholder="08xxxxxxxxxx"></label>

P.dash=async()=>{const[t,b]=await Promise.all([call('list',{sheet:'Transaksi'}),call('list',{sheet:'Booking'})]);const T=t.rows,B=b.rows,td=today(),sum=a=>a.reduce((s,x)=>s+Number(x.Total),0);
 const days=[...Array(7)].map((_,i)=>{const d=new Date(Date.now()-(6-i)*864e5).toISOString().slice(0,10);return[d.slice(8),sum(T.filter(x=>D10(x.Tanggal)==d))]}),mx=Math.max(...days.map(d=>d[1]),1);
 return `<h2 class="pt">Halo, ${esc(S.user.Nama.split(' ')[0])} 👋</h2><p class="mu">Ringkasan ${NAMA}</p>
<div class="stats">${[[ic('banknote'),'Omzet hari ini',rp(sum(T.filter(x=>D10(x.Tanggal)==td)))],[ic('trend'),'Omzet bulan ini',rp(sum(T.filter(x=>D10(x.Tanggal).startsWith(td.slice(0,7)))))],[ic('clock'),'Booking menunggu',B.filter(x=>x.Status=='Menunggu').length],[ic('receipt'),'Total transaksi',T.length]].map(([i,l,v])=>`<div class="card st2"><i>${i}</i><small>${l}</small><b>${v}</b></div>`).join('')}</div>
<div class="dg"><div class="card" style="margin:0"><b>Omzet 7 hari terakhir</b><div class="chart">${days.map(([d,v])=>`<div title="${rp(v)}"><span style="height:${v/mx*100}%"></span><small>${d}</small></div>`).join('')}</div></div>
<div><h3 class="st dgt">Booking Terbaru</h3>${B.sort(bsort).slice(0,4).map(x=>bcard(x,0)).join('')||'<div class="empty">Belum ada booking</div>'}</div></div>`};

P.booking=async()=>{const r=S.bk=(await call('list',{sheet:'Booking'})).rows.sort(bsort);return `<h2 class="pt">Daftar Booking</h2><div style="height:10px"></div>${r.map(b=>bcard(b,1)).join('')||'<div class="empty">Belum ada booking</div>'}`};
async function setSt(id,s){if(s=='Batal'&&!confirm('Tolak / batalkan booking ini?'))return;if(await run(()=>call('setStatus',{id,status:s}))){toast('Status diperbarui');go(S.v)}}
function toPos(id){const b=(S.bk||[]).concat(S.pbk||[]).find(x=>x.ID==id);if(!b)return;S.pos=Object.assign(posNew(),{bid:b.ID,nama:b.Nama,items:[{LayananID:b.LayananID,PegawaiID:b.PegawaiID}]});go('pos')}

/* Kasir / POS */
function posNew(){return{bid:'',nama:'',items:[],dtype:'rp',dval:'',metode:'Tunai',bayar:'',cat:'Semua',q:''}}
const posLay=id=>S.pub.layanan.find(l=>l.ID==id)||{};
const posSub=()=>S.pos.items.reduce((t,i)=>t+Number(posLay(i.LayananID).Harga||0),0);
function posCalc(){const p=S.pos,sub=posSub(),v=Math.max(0,+p.dval||0),dis=Math.round(p.dtype=='pct'?sub*Math.min(100,v)/100:Math.min(sub,v)),tot=Math.max(0,sub-dis),bayar=p.metode=='Tunai'?(+p.bayar||0):tot;return{sub,dis,tot,bayar,kem:bayar-tot}}
const catsH=()=>['Semua',...new Set(S.pub.layanan.map(l=>l.Kategori).filter(Boolean))].map(c=>`<button class="cat ${S.pos.cat==c?'on':''}" onclick="posCat('${esc(c)}')">${esc(c)}</button>`).join('');
function etaH(){const p=S.pos,q=p.q.toLowerCase(),L=S.pub.layanan.filter(l=>(p.cat=='Semua'||l.Kategori==p.cat)&&(!q||(l.Nama+' '+l.Kategori).toLowerCase().includes(q)));
 return L.map(l=>{const c=p.items.filter(i=>i.LayananID==l.ID).length;return `<button class="pcard" onclick="posAdd('${l.ID}')">${pic(l.Gambar,ico(l.Kategori))}${c?`<span class="qb">${c}</span>`:''}<div class="pi"><b>${esc(l.Nama)}</b><small>${l.Durasi} menit</small><div class="row"><span class="pr">${rp(l.Harga)}</span><span class="plus">${ic('plus')}</span></div></div></button>`}).join('')||'<div class="empty">Layanan tidak ditemukan</div>'}
const bqH=()=>{const L=(S.pbk||[]).slice().sort((a,b)=>(D10(a.Tanggal)+a.Jam).localeCompare(D10(b.Tanggal)+b.Jam)).slice(0,8);
 return L.length?`<div class="bq"><small>Booking siap dibayar</small><div class="chips">${L.map(b=>`<button class="chip ${S.pos.bid==b.ID?'on':''}" onclick="posBk('${b.ID}')"><b>${esc(b.Nama)}</b><small>${JM(b.Jam)} • ${esc(b.LayananNama)}</small></button>`).join('')}</div></div>`:''};
const quickH=t=>[...new Set([t,Math.ceil(t/10000)*10000,Math.ceil(t/50000)*50000,Math.ceil(t/100000)*100000])].filter(v=>v>0).slice(0,4).map(v=>`<button class="chip" onclick="posQ(${v})">${v==t?'Uang pas':rp(v)}</button>`).join('');
const kemT=c=>c.kem<0?'Kurang '+rp(-c.kem):rp(c.kem);
function cartH(){const p=S.pos,c=posCalc();
 return `<div class="row"><b style="font-size:16px">Pesanan${p.bid?' <span class="bd Dikonfirmasi">Dari booking</span>':''}</b><button class="x" title="Kosongkan pesanan" onclick="posClear()">${ic('trash')}</button></div>
<label style="margin:10px 0 4px">Nama pelanggan<input value="${esc(p.nama)}" placeholder="Umum" oninput="S.pos.nama=this.value"></label>
<div class="cl">${p.items.map((i,k)=>`<div class="ci"><div class="cn"><b>${esc(posLay(i.LayananID).Nama)}</b><span class="pr">${rp(posLay(i.LayananID).Harga)}</span></div><div class="cs"><select onchange="S.pos.items[${k}].PegawaiID=this.value">${S.pub.pegawai.map(x=>`<option value="${x.ID}" ${x.ID==i.PegawaiID?'selected':''}>${esc(x.Nama)}</option>`).join('')}</select><button class="x" title="Hapus" onclick="posDel(${k})">${ic('x')}</button></div></div>`).join('')||`<div class="empty">${ic('scissors')}<br>Ketuk layanan di etalase untuk menambah pesanan</div>`}</div>
<div class="dr"><div class="seg2"><button class="${p.dtype=='rp'?'on':''}" onclick="posDt('rp')">Rp</button><button class="${p.dtype=='pct'?'on':''}" onclick="posDt('pct')">%</button></div><input type="number" min="0" value="${p.dval}" placeholder="Diskon" oninput="S.pos.dval=this.value;posNum()"></div>
<div class="sm2"><div class="row"><span class="mu">Subtotal</span><span id="psub">${rp(c.sub)}</span></div><div class="row"><span class="mu">Diskon</span><span id="pdis">-${rp(c.dis)}</span></div></div>
<div class="row tt"><span>Total</span><b id="ptot">${rp(c.tot)}</b></div>
<div class="seg" style="margin:14px 0 10px">${['Tunai','QRIS','Transfer','Debit'].map(m=>`<button class="${p.metode==m?'on':''}" onclick="S.pos.metode='${m}';cartDraw()">${m}</button>`).join('')}</div>
${p.metode=='Tunai'?`<label style="margin-bottom:8px">Uang diterima<input id="pb" type="number" min="0" value="${p.bayar}" placeholder="0" oninput="S.pos.bayar=this.value;posNum()"></label><div class="chips qk" id="qk">${quickH(c.tot)}</div><div class="row kem"><span>Kembalian</span><b id="pk" style="color:${c.kem<0?'#E11D48':'#059669'}">${kemT(c)}</b></div>`:`<p class="mu" style="font-size:12px;margin:0 0 12px">Pembayaran ${p.metode}: pastikan dana sudah masuk sebelum menekan bayar.</p>`}
<button class="btn" id="pbtn" onclick="posPay()" ${!p.items.length||c.bayar<c.tot?'disabled':''}>${ic('check')} Bayar ${rp(c.tot)}</button>`}
const cbarH=()=>{const n=S.pos.items.length,c=posCalc();return `<span>${ic('card')} <b>${n} layanan</b></span><b>${rp(c.tot)}</b><span>Lihat pesanan</span>`};
function posH(){const p=S.pos,ps=S.ps||{n:0,omzet:0};
 return `<div class="posh"><div><h2 class="pt">Kasir</h2><small>${new Date().toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'})} • ${esc(S.user.Nama)}</small></div><div class="pst"><small>Penjualan hari ini</small><b>${rp(ps.omzet)}</b><small>${ps.n} transaksi</small></div></div>
<div class="pos"><section><div class="sb">${ic('search')}<input placeholder="Cari layanan..." value="${esc(p.q)}" oninput="S.pos.q=this.value;posEta()"></div><div class="cats" id="cats">${catsH()}</div>${bqH()}<div class="eg" id="eta">${etaH()}</div></section><aside class="cartp" id="cart">${cartH()}</aside></div>
<div class="cbar ${p.items.length?'':'hide'}" id="cbar" onclick="$('#cart').scrollIntoView({behavior:'smooth'})">${cbarH()}</div>`}
const posDraw=()=>{$('#main').innerHTML=posH()};
const posEta=()=>{$('#eta').innerHTML=etaH()};
const cartDraw=()=>{$('#cart').innerHTML=cartH();cbarDraw()};
function cbarDraw(){const e=$('#cbar');if(!e)return;e.classList.toggle('hide',!S.pos.items.length);e.innerHTML=cbarH()}
function posNum(){const c=posCalc(),set=(id,v)=>{const e=$('#'+id);if(e)e.textContent=v};set('psub',rp(c.sub));set('pdis','-'+rp(c.dis));set('ptot',rp(c.tot));
 const k=$('#pk');if(k){k.textContent=kemT(c);k.style.color=c.kem<0?'#E11D48':'#059669'}
 const b=$('#pbtn');if(b){b.disabled=!S.pos.items.length||c.bayar<c.tot;b.innerHTML=`${ic('check')} Bayar ${rp(c.tot)}`}
 const q=$('#qk');if(q)q.innerHTML=quickH(c.tot);cbarDraw()}
function posCat(c){S.pos.cat=c;$('#cats').innerHTML=catsH();posEta()}
function posAdd(id){if(!S.pub.pegawai.length)return toast('Belum ada pegawai aktif. Tambahkan di menu Pegawai.',1);const last=S.pos.items[S.pos.items.length-1];S.pos.items.push({LayananID:id,PegawaiID:last?last.PegawaiID:S.pub.pegawai[0].ID});posEta();cartDraw()}
function posDel(k){S.pos.items.splice(k,1);posEta();cartDraw()}
function posDt(t){S.pos.dtype=t;cartDraw()}
function posQ(v){S.pos.bayar=v;const e=$('#pb');if(e)e.value=v;posNum()}
function posClear(){if(S.pos.items.length&&!confirm('Kosongkan seluruh pesanan?'))return;S.pos=posNew();posDraw()}
function posBk(id){const b=(S.pbk||[]).find(x=>x.ID==id);if(!b)return;if(!S.pub.layanan.some(l=>l.ID==b.LayananID))return toast('Layanan pada booking ini sudah nonaktif',1);
 S.pos=Object.assign(posNew(),{bid:b.ID,nama:b.Nama,items:[{LayananID:b.LayananID,PegawaiID:b.PegawaiID}]});posDraw()}
P.pos=async()=>{const[d,b,t]=await Promise.all([loadPub(),call('list',{sheet:'Booking'}),call('list',{sheet:'Transaksi'})]);
 S.pbk=b.rows.filter(x=>['Dikonfirmasi','Proses','Selesai'].includes(x.Status));const td=today(),tt=t.rows.filter(x=>D10(x.Tanggal)==td);S.ps={n:tt.length,omzet:tt.reduce((a,x)=>a+Number(x.Total),0)};return posH()};
async function posPay(){const p=S.pos,c=posCalc();if(!p.items.length)return toast('Pilih layanan dulu',1);if(c.bayar<c.tot)return toast('Uang diterima kurang dari total',1);
 const r=await run(()=>call('checkout',{bookingId:p.bid,nama:p.nama.trim(),items:p.items,diskon:c.dis,metode:p.metode,dibayar:c.bayar}));
 if(r){S.pos=posNew();receipt(r.trx,r.items);go('pos')}}

const lgi=()=>CFG.Logo?`<img class="lgi" src="${esc(CFG.Logo)}" alt="">`:'';
function rcH(t,its){const r=(a,b)=>`<div class="row"><span>${a}</span><span>${b}</span></div>`;
 return `<div class="rc">${lgi()}<h3>${esc(NAMA)}</h3>${CFG.Alamat?`<p>${esc(CFG.Alamat)}</p>`:''}${CFG.Telp?`<p>Telp ${esc(CFG.Telp)}</p>`:''}<hr><p>${esc(t.NoStruk)}<br>${D10(t.Tanggal)} • Kasir: ${esc(t.Kasir)}</p>${t.Nama&&t.Nama!='Umum'?`<p>Pelanggan: ${esc(t.Nama)}</p>`:''}<hr>${its.map(i=>r(esc(i.Nama),rp(i.Harga))).join('')}<hr>${r('Subtotal',rp(t.Subtotal))}${Number(t.Diskon)>0?r('Diskon','-'+rp(t.Diskon)):''}<div class="row"><b>Total</b><b>${rp(t.Total)}</b></div>${r(esc(t.Metode),rp(t.Dibayar))}${r('Kembali',rp(t.Kembalian))}<hr><p>${esc(CFG.FooterNota||'Terima kasih')}</p></div>`}
function printHTML(inner,k){k=String(k||CFG.Kertas)=='58'?'58':'80';const pg=k+'mm',w=k=='58'?'48mm':'72mm',fs=k=='58'?'10px':'12px';
 const f=document.createElement('iframe');f.style.cssText='position:fixed;right:0;bottom:0;width:0;height:0;border:0';document.body.append(f);
 const d=f.contentWindow.document;d.open();d.write(`<!doctype html><html><head><meta charset="utf-8"><title>Nota</title><style>@page{size:${pg} auto;margin:0}*{box-sizing:border-box}body{margin:0;padding:3mm 2mm;width:${pg};font:${fs}/1.35 "Courier New",monospace;color:#000}.rc{width:${w};margin:0 auto;text-align:center}.row{display:flex;justify-content:space-between;gap:6px;text-align:left}hr{border:0;border-top:1px dashed #000;margin:5px 0}.lgi{display:block;margin:0 auto 4px;max-width:34mm;max-height:20mm;filter:grayscale(1) contrast(1.4)}h3{font-size:1.25em;margin:0}p{margin:2px 0}</style></head><body>${inner}</body></html>`);d.close();
 const go2=()=>{try{f.contentWindow.focus();f.contentWindow.print()}catch(e){toast('Gagal membuka dialog cetak',1)}setTimeout(()=>f.remove(),60000)};
 const im=d.querySelector('img');if(im&&!im.complete){im.onload=im.onerror=go2}else setTimeout(go2,200)}

const genPw=()=>{const c='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789';return[...Array(8)].map(()=>c[Math.floor(Math.random()*c.length)]).join('')};
function pwReset(id){const u=S.rows.find(x=>x.ID==id);S.rid=id;
 modal(`<h3>Reset password</h3><p class="mu" style="margin-bottom:12px">${esc(u.Nama)} (@${esc(u.Username)}, ${esc(u.Role)})</p><label>Password baru (min. 6 karakter)<input id="pw1" type="text" autocomplete="off" value="${genPw()}"></label><button class="btn sm gh" onclick="$('#pw1').value=genPw()">${ic('refresh')} Buat acak</button><p class="mu" style="margin:10px 0;font-size:12px">Catat password ini dan berikan ke pemilik akun. Setelah login, ia bisa menggantinya lewat tombol 🔑 di pojok atas.</p><div class="acts"><button class="btn sm" onclick="doPwReset()">Simpan password</button><button class="btn sm gh" onclick="closeM()">Batal</button></div>`)}

 if(await run(()=>call('resetPassword',{id:S.rid,password:pw})))modal(`<h3>✅ Password direset</h3><p class="mu">Berikan password baru ini ke pemilik akun:</p><div class="ok"><div class="kode" style="font-size:22px;letter-spacing:2px">${esc(pw)}</div></div><button class="btn" onclick="closeM()">Selesai</button>`)}

 if(await run(()=>call('changePassword',{oldPassword:o,newPassword:n}))){closeM();toast('Password berhasil diganti')}}

P.setting=async()=>{if(role()!='Admin')throw Error('Akses ditolak');await loadPub();S.cfgLogo=CFG.Logo;
 const f=(id,l,v,ph='')=>`<label>${l}<input id="${id}" value="${esc(v)}" placeholder="${ph}"></label>`;
 const warn=S.pub&&S.pub.setting?'':'<div class="card" style="background:#FFF1D6;color:#7A5200">Backend belum mengirim data pengaturan. Tempel ulang Code.gs terbaru, jalankan <b>setupDatabase</b>, lalu buat <b>versi deployment baru</b>.</div>';
 return `${warn}<h2 class="pt">Pengaturan Salon</h2><p class="mu" style="margin-bottom:12px">Nama, logo, dan nota cetak</p>
<div class="card"><b>Identitas usaha</b><div style="height:12px"></div>${f('cf_nama','Nama usaha',CFG.NamaSalon)}${f('cf_alamat','Alamat',CFG.Alamat,'Jl. ...')}${f('cf_telp','Telepon',CFG.Telp,'0370-...')}${f('cf_wa','WhatsApp salon (untuk pelanggan)',CFG.WhatsApp,'08xxxxxxxxxx')}
<label>Logo usaha (gambar akan dikecilkan otomatis)<input type="file" accept="image/*" onchange="readLogo(this)"></label>
<div class="row" style="justify-content:flex-start;margin-bottom:6px"><img id="lgp" class="lgi" style="${CFG.Logo?'':'display:none;'}margin:0" src="${esc(CFG.Logo)}" alt=""><button class="btn sm gh" onclick="S.cfgLogo='';$('#lgp').style.display='none'">${ic('trash')} Hapus logo</button></div></div>
<div class="card"><b>Nota</b><div style="height:12px"></div>${f('cf_footer','Teks bawah nota',CFG.FooterNota)}
<label>Ukuran kertas default<select id="cf_kertas"><option value="58" ${CFG.Kertas=='58'?'selected':''}>58 mm</option><option value="80" ${CFG.Kertas!='58'?'selected':''}>80 mm</option></select></label>
<label>Cetak otomatis setelah pembayaran<select id="cf_auto"><option value="1" ${CFG.AutoCetak!='0'?'selected':''}>Ya</option><option value="0" ${CFG.AutoCetak=='0'?'selected':''}>Tidak</option></select></label>
<button class="btn sm gh" onclick="testNota()">${ic('printer')} Cetak contoh nota</button><small style="margin-top:8px">Simpan pengaturan dulu agar logo dan teks terbaru ikut tercetak.</small></div>
<button class="btn" onclick="saveCfg()">Simpan pengaturan</button>`};
function readLogo(inp){const f=inp.files[0];if(!f)return;const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{let m=240,d='';
  for(let t=0;t<5;t++){const k=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*k));c.height=Math.max(1,Math.round(im.height*k));const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);d=c.toDataURL('image/jpeg',.85);if(d.length<=42000)break;m*=.75}
  if(d.length>42000)return toast('Logo terlalu besar, pilih gambar lain',1);S.cfgLogo=d;const pv=$('#lgp');pv.src=d;pv.style.display='block'};im.onerror=()=>toast('File bukan gambar yang valid',1);im.src=fr.result};fr.readAsDataURL(f)}
async function saveCfg(){const v=i=>$('#'+i).value.trim();if(!v('cf_nama'))return toast('Nama usaha wajib diisi',1);
 const s={NamaSalon:v('cf_nama'),Alamat:v('cf_alamat'),Telp:v('cf_telp'),WhatsApp:v('cf_wa'),FooterNota:v('cf_footer'),Kertas:v('cf_kertas'),AutoCetak:v('cf_auto'),Logo:S.cfgLogo||''};
 const r=await run(()=>call('saveSettings',{settings:s}));if(r){applyCfg(r.setting);toast('Pengaturan tersimpan');go('setting')}}
